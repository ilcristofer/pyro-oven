; PlatformIO Project Configuration
; Forno Pizza - Interfaccia LVGL stile Effeuno
; Hardware: WT32-SC01 + 2x MAX31855

[env:esp32-sc01]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Configurazione specifica per WT32-SC01
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.partitions = min_spiffs.csv  ; OTA support (~1.9MB app + ~1.9MB OTA)

; PSRAM e LVGL flags
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_TICK_CUSTOM=1
    -I src

; Librerie necessarie
lib_deps =
    adafruit/Adafruit MAX31855 library@^1.3.0
    lovyan03/LovyanGFX@^1.1.12
    lvgl/lvgl@^8.3.11

; Configurazione upload (CP210x)
upload_speed = 921600
monitor_filters = esp32_exception_decoder
